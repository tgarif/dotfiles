#  ── HYPRIDLE ────────────────────────────────────────────────────
#
#  ALL IDLE BEHAVIOUR IS DISABLED, deliberately.
#
#    · no auto-lock on idle
#    · no auto-lock on suspend
#    · no screen blanking — the display stays exactly as you left it
#
#  There are NO listener blocks below. hypridle is still running, and it
#  still has a job: it listens for logind's Lock/Unlock signals, which is
#  what makes these work at all —
#
#      SUPER + ESCAPE                    (runs `loginctl lock-session`)
#      the padlock in the notification centre
#
#  Kill hypridle and those stop doing anything, because nothing would be
#  left to answer the Lock signal and start hyprlock.
#
#  EXPECTED, NOT A FAULT: with no listeners hypridle logs
#      [ERR] Config has errors: No rules configured
#      Proceeding ignoring faulty entries
#  It then carries on and registers dbus normally — verified: it takes the
#  login1 session path, claims org.freedesktop.ScreenSaver and binds
#  ext_session_lock_manager_v1, which is the whole lock path. Ignore the
#  line; it just means "this file has no timers", which is the point.
#
#  ── OLED NOTE ───────────────────────────────────────────────────
#  The MSI MPG321UX is an OLED and the screen now never blanks, so waybar
#  and any static window sit on the panel indefinitely. That is the
#  trade-off you chose knowingly. Two things worth knowing:
#
#   · The panel's own compensation cycle generally runs when it drops into
#     standby. With no host-side blanking it may not get the chance, so
#     check the monitor's OSD for its own screen-saver / standby timer and
#     any "OLED Care" options, and lean on those instead.
#   · If you ever want a very long safety net rather than nothing at all,
#     uncomment this — 2 hours is long enough never to interrupt you:
#
#       listener {
#           timeout = 7200
#           on-timeout = hyprctl dispatch dpms off
#           on-resume = hyprctl dispatch dpms on && ~/.config/hypr/scripts/monitors.sh
#       }
#
#  Apply changes with:  pkill hypridle && hypridle &

general {
    #  HOW to lock when a lock is actually requested — by you, or by any
    #  program calling `loginctl lock-session`. Nothing here starts a lock
    #  on its own; there are no timers in this file.
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 hyprlock

    #  Deliberately absent: before_sleep_cmd. Resuming from suspend goes
    #  straight back to the desktop with no password.

    #  Still useful — makes sure the outputs come back on after a resume.
    after_sleep_cmd = hyprctl dispatch dpms on

    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}
