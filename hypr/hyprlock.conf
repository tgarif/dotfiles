#  ── HYPRLOCK ────────────────────────────────────────────────────
#     Lockscreen · SUPER+ESCAPE (or `loginctl lock-session`)

$font     = JetBrainsMono Nerd Font
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$mauve    = rgb(cba6f7)
$red      = rgb(f38ba8)
$green    = rgb(a6e3a1)
$yellow   = rgb(f9e2af)
$peach    = rgb(fab387)
$surface  = rgb(313244)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true

    #  Fractional scaling is in play on the 4K — let hyprlock handle it
    fractional_scaling = 1
}

auth {
    pam {
        enabled = true
    }
}

#  ── BACKGROUND ──────────────────────────────────────────────────
#
#  `screenshot` grabs whatever was on screen and blurs it, rather than
#  pointing at a wallpaper file. Two reasons: it always works even if
#  ~/Pictures/Wallpapers is empty, and it stays visually continuous
#  with whatever you were doing when the lock kicked in.
#
#  Applied to every monitor (empty monitor = all).
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.89
    brightness = 0.78
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

#  ── CLOCK (all three monitors) ──────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $text
    font_size = 112
    font_family = $font ExtraBold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(11111bcc)
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext
    font_size = 22
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(11111bcc)
    position = 0, 165
    halign = center
    valign = center
}

#  ── INPUT (primary monitor only) ────────────────────────────────
#
#  Deliberately pinned to the BenQ rather than replicated. hyprlock draws
#  a widget on every monitor when `monitor` is blank, which would give
#  three password boxes and no clue which one has keyboard focus.
#
#  Matched by DESCRIPTION, not DP-N: connector names move with driver
#  load order, and a stale name here would draw the password box on no
#  monitor at all. (Typing still authenticates even if the field is not
#  visible, so this can never lock you out — it would just be blind.)

label {
    monitor = desc:BNQ XL2566X+
    text =   $USER
    color = $text
    font_size = 18
    font_family = $font Medium
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor = desc:BNQ XL2566X+

    size = 340, 54
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1

    outer_color = $surface
    inner_color = rgba(30, 30, 46, 0.85)
    font_color = $text
    font_family = $font

    check_color = $mauve
    fail_color = $red

    #  Native lock-key indicators: the field border turns yellow on
    #  Caps Lock. Far better than polling `hyprctl devices` from a
    #  label every 250ms, which is what a hand-rolled version costs.
    capslock_color = $yellow
    numlock_color = -1
    bothlock_color = $peach
    invert_numlock = false

    fade_on_empty = false
    rounding = 16

    placeholder_text = <span foreground="##a6adc8"><i>Password…</i></span>
    fail_text = <span foreground="##f38ba8">$FAIL  ($ATTEMPTS)</span>

    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

#  ── HINT ────────────────────────────────────────────────────────

label {
    monitor = desc:BNQ XL2566X+
    text = 󰌾  Locked
    color = $subtext
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
