<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ══════════════════════════════════════════════════════════════
       FONTCONFIG
       Generic family aliases + Wayland-correct rendering.
       Rebuild the cache after editing:  fc-cache -fv
       ══════════════════════════════════════════════════════════════ -->

  <!-- ── GENERIC FAMILY DEFAULTS ──────────────────────────────── -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── NERD FONT SYMBOL FALLBACK ────────────────────────────────
       Any font that lacks a glyph falls back to the Nerd Font symbol
       set. This is what keeps waybar / starship / tmux icons from
       rendering as tofu boxes in apps that pick their own font. -->

  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ── RENDERING ────────────────────────────────────────────────
       Wayland composites without subpixel geometry, so RGBA subpixel
       antialiasing produces visible colour fringing on text. Greyscale
       AA with slight hinting is the correct combination here. -->

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="dpi" mode="assign"><double>96</double></edit>
  </match>

  <!-- Keep bitmap fonts out; they look terrible at high DPI -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="scalable"><bool>false</bool></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- Emoji should always resolve to the colour font, never a
       monochrome symbol font that happens to cover the codepoint. -->
  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
