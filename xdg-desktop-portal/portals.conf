#  ── XDG DESKTOP PORTALS ─────────────────────────────────────────
#
#  Portals are how sandboxed / toolkit-agnostic apps ask the desktop to
#  do privileged things: pick a file, share a screen, read the dark-mode
#  preference. Without explicit routing you get the warnings
#
#      No such interface "org.freedesktop.portal.Settings"
#      No such interface "org.freedesktop.portal.Inhibit"
#
#  because xdg-desktop-portal-hyprland implements only the screencopy
#  side and nothing answers for the rest.
#
#  Split of responsibilities:
#    hyprland → screen capture / recording (it owns the compositor)
#    gtk      → file dialogs, appearance/dark-mode, inhibit, settings
#
#  Applies to: OBS and browser screen sharing, Chrome/Electron file
#  pickers, and apps that follow the system dark preference.

[preferred]
default = hyprland;gtk

org.freedesktop.impl.portal.Screenshot = hyprland
org.freedesktop.impl.portal.ScreenCast = hyprland

org.freedesktop.impl.portal.FileChooser = gtk
org.freedesktop.impl.portal.Settings = gtk
org.freedesktop.impl.portal.Inhibit = gtk
org.freedesktop.impl.portal.Notification = gtk
org.freedesktop.impl.portal.Secret = gtk
