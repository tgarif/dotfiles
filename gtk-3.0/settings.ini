[Settings]
gtk-theme-name=catppuccin-mocha-mauve-standard+default
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-font-name=Inter 11

gtk-application-prefer-dark-theme=1

# Hyprland draws the window frame, so GTK must not add its own titlebar
# buttons to tiled windows.
gtk-decoration-layout=menu:

gtk-enable-animations=1
gtk-primary-button-warps-slider=1

# Wayland has no subpixel geometry, so RGBA hinting produces colour
# fringing. Greyscale antialiasing is the correct choice here.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none

gtk-menu-images=1
gtk-button-images=1
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-recent-files-limit=20
